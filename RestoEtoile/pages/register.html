<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <nav>
        <div class="logo">Resto Etoile</div>
        <ul><li><a href="../index.html">Retour</a></li></ul>
    </nav>

    <div class="container">
        <div class="form-box">
            <h2 style="color:var(--accent-gold); text-align:center;">Créer un compte</h2>
            <br>
            <form>
                <div class="form-group">
                    <label>Nom</label>
                    <input type="text">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email">
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password">
                </div>
                <button type="submit" class="btn" style="width:100%">S'inscrire</button>
            </form>
        </div>
    </div>
</body>
</html>
