<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votre Panier - Resto Etoile</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/script.js"></script>
</head>
<body>
    <nav>
        <div class="logo">Resto Etoile</div>
        <ul>
            <li><a href="../index.html">Accueil</a></li>
            <li><a href="produits.html">La Carte</a></li>
            <li><a href="pages/panier.html" class="cart-link">Panier</a></li>
            <li><a href="login.html">Connexion</a></li>

        </ul>
    </nav>

    <div class="container">
        <h1>Votre Panier</h1>
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Produit</th>
                    <th>Quantité</th>
                    <th>Prix unitaire</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="cart-items">
                </tbody>
        </table>

        <div style="text-align: right; font-size: 1.5rem; color: var(--accent-gold);">
            <strong>Total à payer : <span id="cart-total">0.00€</span></strong>
        </div>
        
        <div style="text-align: right; margin-top: 20px;">
            <button onclick="localStorage.clear(); location.reload();" class="btn" style="background-color:#c0392b; margin-right:10px;">Vider le panier</button>
            <a href="#" class="btn">Valider la commande</a>
        </div>
    </div>
</body>
</html>
