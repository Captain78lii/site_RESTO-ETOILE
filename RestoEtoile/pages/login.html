<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <nav>
        <div class="logo">Resto Etoile</div>
        <ul><li><a href="../index.html">Retour</a></li></ul>
    </nav>

    <div class="container">
        <div class="form-box">
            <h2 style="color:var(--accent-gold); text-align:center;">Se connecter</h2>
            <br>
            <form>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="votre@email.com">
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" placeholder="******">
                </div>
                <button type="submit" class="btn" style="width:100%">Entrer</button>
            </form>
            <p style="text-align:center; margin-top:1rem;">
                Pas encore de compte ? <a href="register.html" style="color:var(--accent-gold)">S'inscrire</a>
            </p>
        </div>
    </div>
</body>
</html>
